<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog | SewaVerse</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons & Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#534EE5', 600: '#4338CA' },
                        accent: { yellow: '#FDE047', pink: '#F9A8D4', green: '#86EFAC', cyan: '#67E8F9' },
                        app: { dark: '#0F172A', bg: '#FAFAF9' }
                    },
                    fontFamily: { sans: ['Nunito', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #FAFAF9; color: #0F172A; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .neo-shadow { box-shadow: 4px 4px 0px #0F172A; }
        .neo-shadow-sm { box-shadow: 2px 2px 0px #0F172A; }
        
        /* Hapus panah pada input number */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="antialiased relative pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 w-full bg-white border-b border-app-dark shadow-sm transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Branding & Alamat -->
                <div class="flex items-center gap-3" data-aos="fade-right">
                    <div class="w-10 h-10 bg-brand-500 border-2 border-app-dark rounded-xl flex items-center justify-center text-white neo-shadow-sm shrink-0">
                        <i class="fa-solid fa-tent text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black text-app-dark leading-tight tracking-tight">SewaVerse</h1>
                        <p class="text-[10px] sm:text-xs font-bold text-slate-500"><i class="fa-solid fa-location-dot text-accent-pink mr-1"></i>Jl. Pendaki No. 99, Jakarta</p>
                    </div>
                </div>

                <!-- Tombol Search & Keranjang Tanpa Kotak -->
                <div class="flex items-center gap-5 pr-2" data-aos="fade-left">
                    <!-- Tombol Search -->
                    <button class="text-app-dark text-xl hover:text-brand-500 active:scale-75 transition-transform">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <!-- Tombol Keranjang -->
                    <button onclick="toggleCart()" class="relative text-app-dark text-2xl hover:text-brand-500 active:scale-75 transition-transform">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cart-badge" class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Filter Kategori -->
        <div class="mb-6" data-aos="fade-up">
            <div class="flex gap-2 overflow-x-auto hide-scrollbar py-2" id="filter-container">
                <button onclick="filterProducts('Semua')" data-cat="Semua" class="filter-btn active px-4 py-2 bg-app-dark text-white border-2 border-app-dark rounded-full text-sm font-bold whitespace-nowrap transition-colors">Semua</button>
                <button onclick="filterProducts('Sewa')" data-cat="Sewa" class="filter-btn px-4 py-2 bg-white text-app-dark border-2 border-app-dark rounded-full text-sm font-bold whitespace-nowrap hover:bg-slate-100 transition-colors">Item Sewa</button>
                <button onclick="filterProducts('Jual')" data-cat="Jual" class="filter-btn px-4 py-2 bg-white text-app-dark border-2 border-app-dark rounded-full text-sm font-bold whitespace-nowrap hover:bg-slate-100 transition-colors">Item Jual</button>
                
                <!-- Tombol Filter (Popup) -->
                <button onclick="openFilterModal()" class="px-4 py-2 bg-accent-cyan text-app-dark border-2 border-app-dark rounded-full text-sm font-bold whitespace-nowrap hover:bg-[#22d3ee] transition-colors shadow-[2px_2px_0px_#0F172A]">
                    <i class="fa-solid fa-filter mr-1"></i> Filter
                </button>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <!-- Produk di-generate via JavaScript -->
        </div>

    </main>

    <!-- Floating WhatsApp -->
    <a href="#" class="fixed bottom-6 right-6 z-30 w-14 h-14 bg-[#25D366] text-white border-2 border-app-dark rounded-full flex items-center justify-center text-3xl neo-shadow hover:-translate-y-1 transition-transform" data-aos="zoom-in" data-aos-delay="400">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- MODAL FILTER KATEGORI -->
    <div id="filter-modal" class="fixed inset-0 bg-app-dark/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white border-2 border-app-dark rounded-2xl w-full max-w-sm overflow-hidden neo-shadow transform scale-95 transition-transform duration-200" id="filter-modal-content">
            <div class="p-4 border-b-2 border-app-dark flex justify-between items-center bg-accent-yellow">
                <h2 class="text-lg font-black text-app-dark"><i class="fa-solid fa-list mr-2"></i>Kategori Lengkap</h2>
                <button onclick="closeFilterModal()" class="w-8 h-8 bg-white border-2 border-app-dark rounded-full flex items-center justify-center text-app-dark hover:bg-accent-pink">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 flex flex-col gap-3">
                <button onclick="selectExtendedFilter('Tenda')" class="w-full text-left font-bold text-app-dark px-4 py-3 bg-white border-2 border-app-dark rounded-xl hover:bg-slate-100 transition-colors shadow-[2px_2px_0px_#0F172A]">Tenda</button>
                <button onclick="selectExtendedFilter('Sepatu')" class="w-full text-left font-bold text-app-dark px-4 py-3 bg-white border-2 border-app-dark rounded-xl hover:bg-slate-100 transition-colors shadow-[2px_2px_0px_#0F172A]">Sepatu</button>
                <button onclick="selectExtendedFilter('Carrier')" class="w-full text-left font-bold text-app-dark px-4 py-3 bg-white border-2 border-app-dark rounded-xl hover:bg-slate-100 transition-colors shadow-[2px_2px_0px_#0F172A]">Carrier</button>
                <button onclick="selectExtendedFilter('Aksesoris')" class="w-full text-left font-bold text-app-dark px-4 py-3 bg-white border-2 border-app-dark rounded-xl hover:bg-slate-100 transition-colors shadow-[2px_2px_0px_#0F172A]">Aksesoris</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL ITEM -->
    <div id="detail-modal" class="fixed inset-0 bg-app-dark/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white border-2 border-app-dark rounded-2xl w-full max-w-md overflow-hidden neo-shadow transform scale-95 transition-transform duration-200" id="detail-modal-content">
            <div class="relative w-full h-48 sm:h-56 bg-slate-200 border-b-2 border-app-dark">
                <img id="detail-img" src="" alt="Produk" class="w-full h-full object-cover">
                <button onclick="closeDetailModal()" class="absolute top-3 right-3 w-8 h-8 bg-white border-2 border-app-dark rounded-full flex items-center justify-center text-app-dark hover:bg-accent-pink">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <span id="detail-type" class="absolute top-3 left-3 bg-accent-cyan text-app-dark border-2 border-app-dark text-xs font-bold px-3 py-1 rounded-full uppercase"></span>
            </div>
            <div class="p-5">
                <p id="detail-category" class="text-[10px] text-slate-500 font-bold uppercase mb-1"></p>
                <h3 id="detail-title" class="text-xl font-black text-app-dark mb-2"></h3>
                <p id="detail-price" class="text-lg font-bold text-brand-500 mb-4"></p>
                
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-5">
                    <p class="text-xs font-bold text-app-dark mb-1">Deskripsi:</p>
                    <p id="detail-desc" class="text-sm text-slate-600 font-medium leading-relaxed"></p>
                </div>

                <button id="detail-add-btn" class="w-full py-3 bg-brand-500 text-white border-2 border-app-dark rounded-xl font-bold neo-shadow-sm hover:bg-brand-600 active:translate-y-1 active:shadow-none transition-all">
                    <i class="fa-solid fa-cart-plus mr-2"></i> Tambah ke Keranjang
                </button>
            </div>
        </div>
    </div>

    <!-- DRAWER KERANJANG (CART) -->
    <div id="cart-drawer-bg" class="fixed inset-0 bg-app-dark/60 z-50 hidden opacity-0 transition-opacity" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white border-l-2 border-app-dark z-50 transform translate-x-full transition-transform duration-300 flex flex-col neo-shadow">
        
        <!-- Cart Header -->
        <div class="p-4 border-b-2 border-app-dark flex justify-between items-center bg-accent-yellow">
            <h2 class="text-lg font-black text-app-dark"><i class="fa-solid fa-cart-shopping mr-2"></i>Keranjang Anda</h2>
            <button onclick="toggleCart()" class="w-8 h-8 bg-white border-2 border-app-dark rounded-full flex items-center justify-center hover:bg-accent-pink transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Cart Items List -->
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4 bg-app-bg">
            <!-- Item Cart di-generate via JS -->
            <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-slate-400">
                <i class="fa-solid fa-box-open text-4xl mb-2"></i>
                <p class="font-bold text-sm">Keranjang masih kosong</p>
            </div>
        </div>

        <!-- Cart Footer / Checkout -->
        <div class="p-4 border-t-2 border-app-dark bg-white overflow-y-auto max-h-[50vh] hide-scrollbar">
            
            <!-- Opsi Metode Pembayaran -->
            <div class="mb-4">
                <p class="text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-wider">Metode Pembayaran:</p>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <label class="flex items-center gap-2 p-2.5 border-2 border-app-dark rounded-lg cursor-pointer bg-white hover:bg-slate-50 transition-colors">
                        <input type="radio" name="payment_method" value="Cash" class="accent-brand-500 w-4 h-4" checked onchange="toggleSplitBill(false)">
                        <span class="text-xs font-bold text-app-dark">Cash</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 border-2 border-app-dark rounded-lg cursor-pointer bg-white hover:bg-slate-50 transition-colors">
                        <input type="radio" name="payment_method" value="Transfer" class="accent-brand-500 w-4 h-4" onchange="toggleSplitBill(false)">
                        <span class="text-xs font-bold text-app-dark">Transfer</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 border-2 border-app-dark rounded-lg cursor-pointer bg-white hover:bg-slate-50 transition-colors">
                        <input type="radio" name="payment_method" value="e-Wallet" class="accent-brand-500 w-4 h-4" onchange="toggleSplitBill(false)">
                        <span class="text-xs font-bold text-app-dark">e-Wallet</span>
                    </label>
                    <label class="flex items-center gap-2 p-2.5 border-2 border-app-dark rounded-lg cursor-pointer bg-white hover:bg-slate-50 transition-colors">
                        <input type="radio" name="payment_method" value="Split" class="accent-brand-500 w-4 h-4" onchange="toggleSplitBill(true)">
                        <span class="text-xs font-bold text-app-dark">Split Bill</span>
                    </label>
                </div>
                
                <!-- Form Input Split Bill -->
                <div id="split-bill-container" class="hidden animate-fade-in-up mt-2 bg-app-bg p-3 border-2 border-app-dark rounded-xl">
                    <p class="text-sm font-black text-brand-500 mb-3">Rincian Split Bill</p>
                    
                    <div class="space-y-2">
                        <!-- Input Cash -->
                        <div class="flex items-center justify-between p-2.5 border-2 border-app-dark rounded-xl bg-white shadow-[2px_2px_0px_#0F172A]">
                            <div class="flex items-center gap-2 w-1/3">
                                <i class="fa-solid fa-money-bill text-app-dark"></i>
                                <span class="text-xs font-black text-app-dark">Cash</span>
                            </div>
                            <div class="flex items-center w-2/3 justify-end gap-1">
                                <span class="text-xs font-bold text-slate-400">Rp</span>
                                <input type="number" class="w-full text-right text-sm font-bold text-slate-600 focus:outline-none bg-transparent split-input" placeholder="0" oninput="calculateSplitTotal()">
                            </div>
                        </div>

                        <!-- Input Transfer -->
                        <div class="flex items-center justify-between p-2.5 border-2 border-app-dark rounded-xl bg-white shadow-[2px_2px_0px_#0F172A]">
                            <div class="flex items-center gap-2 w-1/3">
                                <i class="fa-solid fa-building-columns text-app-dark"></i>
                                <span class="text-xs font-black text-app-dark">Transfer</span>
                            </div>
                            <div class="flex items-center w-2/3 justify-end gap-1">
                                <span class="text-xs font-bold text-slate-400">Rp</span>
                                <input type="number" class="w-full text-right text-sm font-bold text-slate-600 focus:outline-none bg-transparent split-input" placeholder="0" oninput="calculateSplitTotal()">
                            </div>
                        </div>

                        <!-- Input Qris -->
                        <div class="flex items-center justify-between p-2.5 border-2 border-app-dark rounded-xl bg-white shadow-[2px_2px_0px_#0F172A]">
                            <div class="flex items-center gap-2 w-1/3">
                                <i class="fa-solid fa-qrcode text-app-dark"></i>
                                <span class="text-xs font-black text-app-dark">Qris</span>
                            </div>
                            <div class="flex items-center w-2/3 justify-end gap-1">
                                <span class="text-xs font-bold text-slate-400">Rp</span>
                                <input type="number" class="w-full text-right text-sm font-bold text-slate-600 focus:outline-none bg-transparent split-input" placeholder="0" oninput="calculateSplitTotal()">
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-4 px-1">
                        <span class="text-xs font-bold text-slate-500">Nominal Terisi:</span>
                        <span id="split-total-label" class="text-sm font-black text-red-500">Rp 0</span>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-end mb-4 pt-3 border-t-2 border-dashed border-slate-300">
                <span class="text-sm font-bold text-slate-600">Total Pembayaran:</span>
                <span id="cart-total" class="text-2xl font-black text-app-dark">Rp 0</span>
            </div>
            <button class="w-full py-3.5 bg-accent-green text-app-dark border-2 border-app-dark rounded-xl font-black neo-shadow-sm hover:bg-[#6ee7b7] active:translate-y-1 active:shadow-none transition-all flex justify-center items-center gap-2">
                Checkout via WA <i class="fa-brands fa-whatsapp text-lg"></i>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inisialisasi Animate On Scroll
        AOS.init({
            once: true,
            offset: 20,
            duration: 500,
            easing: 'ease-out-cubic',
        });

        // Data 9 Item Contoh (Menggunakan picsum agar gambar selalu muncul)
        const products = [
            { id: 1, name: "Tenda Dome 4P Anti Badai Series", price: 45000, type: "Sewa", category: "Tenda", img: "https://picsum.photos/seed/tenda1/400/300", desc: "Tenda kapasitas 4 orang, double layer, anti badai dan embun. Cocok untuk gunung tropis." },
            { id: 2, name: "Sepatu Trekking SNI", price: 30000, type: "Sewa", category: "Sepatu", img: "https://picsum.photos/seed/sepatu/400/300", desc: "Sepatu gunung anti slip dengan pelindung jari. Tersedia ukuran 39-44." },
            { id: 3, name: "Carrier 60L Consina Gunung", price: 35000, type: "Sewa", category: "Carrier", img: "https://picsum.photos/seed/carrier/400/300", desc: "Tas gunung kapasitas 60 liter dengan backsystem nyaman untuk pendakian jauh." },
            { id: 4, name: "Gas Kaleng Hi-Cook Original", price: 20000, type: "Jual", category: "Aksesoris", img: "https://picsum.photos/seed/gas/400/300", desc: "Gas kaleng original untuk kompor portable. Isi penuh." },
            { id: 5, name: "Kompor Portable Mawar Lipat", price: 15000, type: "Sewa", category: "Aksesoris", img: "https://picsum.photos/seed/kompor/400/300", desc: "Kompor lipat anti badai, api biru dan panas merata." },
            { id: 6, name: "Sleeping Bag Polar Ekstrem", price: 15000, type: "Sewa", category: "Aksesoris", img: "https://picsum.photos/seed/sb/400/300", desc: "Sleeping bag bahan polar tebal, limit suhu hingga 5 derajat celcius." },
            { id: 7, name: "Trekking Pole Duralumin", price: 10000, type: "Sewa", category: "Aksesoris", img: "https://picsum.photos/seed/pole/400/300", desc: "Tongkat daki bahan duralumin kuat dan ringan. Shock absorber aktif." },
            { id: 8, name: "Matras Foil 2 Meter", price: 35000, type: "Jual", category: "Aksesoris", img: "https://picsum.photos/seed/matras/400/300", desc: "Matras aluminium foil penahan dingin dari tanah, panjang 2 meter." },
            { id: 9, name: "Tenda Tunnel Keluarga 6P Jumbo", price: 80000, type: "Sewa", category: "Tenda", img: "https://picsum.photos/seed/tenda2/400/300", desc: "Tenda keluarga bentuk terowongan (tunnel), sangat luas dengan ruang tamu depan." }
        ];

        let cart = [];
        let currentFilter = 'Semua';

        // Format Rupiah
        const formatRp = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // Render Produk ke Grid
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = currentFilter === 'Semua' ? products : products.filter(p => p.type === currentFilter || p.category === currentFilter);

            filtered.forEach((product, index) => {
                const typeColor = product.type === 'Sewa' ? 'bg-accent-yellow' : 'bg-accent-green';
                const animDelay = (index % 4) * 100;
                
                const card = `
                    <div data-aos="fade-up" data-aos-delay="${animDelay}" class="bg-white border-2 border-app-dark rounded-xl sm:rounded-2xl flex flex-col overflow-hidden neo-shadow-sm hover:neo-shadow transition-shadow">
                        <!-- Image Area -->
                        <div class="relative h-32 sm:h-48 cursor-pointer border-b-2 border-app-dark overflow-hidden group" onclick="openDetail(${product.id})">
                            <img src="${product.img}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <span class="absolute top-2 left-2 ${typeColor} text-app-dark text-[9px] sm:text-[10px] font-black px-2 py-1 rounded-full uppercase border-2 border-app-dark">
                                ${product.type}
                            </span>
                        </div>
                        
                        <!-- Content Area -->
                        <div class="p-3 sm:p-4 flex flex-col flex-1 justify-between">
                            <div>
                                <p class="text-[9px] sm:text-[10px] text-slate-500 font-bold uppercase mb-0.5">${product.category}</p>
                                <h3 title="${product.name}" class="text-sm sm:text-base font-black text-app-dark leading-tight mb-2 cursor-pointer hover:text-brand-500 truncate" onclick="openDetail(${product.id})">
                                    ${product.name}
                                </h3>
                            </div>
                            
                            <div>
                                <p class="text-brand-500 font-black text-sm sm:text-lg mb-3">${formatRp(product.price)} <span class="text-[10px] font-bold text-slate-500">${product.type === 'Sewa' ? '/hari' : ''}</span></p>
                                <button onclick="addToCart(${product.id})" class="w-full py-2 bg-white text-app-dark border-2 border-app-dark rounded-lg text-xs sm:text-sm font-bold shadow-[2px_2px_0px_#0F172A] hover:bg-slate-50 active:translate-y-0.5 active:shadow-[0px_0px_0px_#0F172A] transition-all">
                                    + Keranjang
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            setTimeout(() => AOS.refresh(), 100);
        }

        // Logic Filter Utama
        function filterProducts(category) {
            currentFilter = category;
            
            // Atur class pada button filter atas
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-app-dark', 'text-white');
                btn.classList.add('bg-white', 'text-app-dark');
                if(btn.dataset.cat === category) {
                    btn.classList.add('bg-app-dark', 'text-white');
                    btn.classList.remove('bg-white', 'text-app-dark');
                }
            });
            renderProducts();
        }

        // Logic Filter dari Modal Kategori Lengkap
        function selectExtendedFilter(category) {
            currentFilter = category;
            
            // Reset button atas karena kita milih spesifik kategori dari popup
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-app-dark', 'text-white');
                btn.classList.add('bg-white', 'text-app-dark');
            });

            closeFilterModal();
            renderProducts();
        }

        // Modal Kategori Lengkap
        function openFilterModal() {
            const modal = document.getElementById('filter-modal');
            const content = document.getElementById('filter-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeFilterModal() {
            const modal = document.getElementById('filter-modal');
            const content = document.getElementById('filter-modal-content');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Modal Detail Item
        function openDetail(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;

            document.getElementById('detail-img').src = product.img;
            document.getElementById('detail-type').innerText = product.type;
            document.getElementById('detail-type').className = `absolute top-3 left-3 text-app-dark border-2 border-app-dark text-xs font-bold px-3 py-1 rounded-full uppercase ${product.type === 'Sewa' ? 'bg-accent-yellow' : 'bg-accent-green'}`;
            document.getElementById('detail-category').innerText = product.category;
            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerHTML = `${formatRp(product.price)} <span class="text-xs text-slate-500">${product.type === 'Sewa' ? '/hari' : ''}</span>`;
            document.getElementById('detail-desc').innerText = product.desc;
            
            const btn = document.getElementById('detail-add-btn');
            btn.onclick = () => { addToCart(id); closeDetailModal(); };

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Keranjang (Cart) Logic
        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const bg = document.getElementById('cart-drawer-bg');
            
            if (drawer.classList.contains('translate-x-full')) {
                bg.classList.remove('hidden');
                setTimeout(() => bg.classList.remove('opacity-0'), 10);
                drawer.classList.remove('translate-x-full');
            } else {
                bg.classList.add('opacity-0');
                drawer.classList.add('translate-x-full');
                setTimeout(() => bg.classList.add('hidden'), 300);
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            updateCartUI();
            
            const badge = document.getElementById('cart-badge');
            badge.classList.add('animate-ping');
            setTimeout(() => badge.classList.remove('animate-ping'), 300);
        }

        function updateQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
                updateCartUI();
            }
        }

        function removeItem(id) {
            cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        // Logic memunculkan Input Nominal jika memilih Split Bill
        function toggleSplitBill(isSplit) {
            const splitContainer = document.getElementById('split-bill-container');
            if(isSplit) {
                splitContainer.classList.remove('hidden');
            } else {
                splitContainer.classList.add('hidden');
                // Reset input fields when hidden
                document.querySelectorAll('.split-input').forEach(input => input.value = '');
                calculateSplitTotal();
            }
        }

        // Hitung total input split bill
        function calculateSplitTotal() {
            const inputs = document.querySelectorAll('.split-input');
            let splitTotal = 0;
            inputs.forEach(input => {
                splitTotal += Number(input.value) || 0;
            });
            
            const splitLabel = document.getElementById('split-total-label');
            splitLabel.innerText = formatRp(splitTotal);
            
            // Hitung total keranjang sebenarnya
            const cartTotalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            // Ubah warna text jika jumlahnya sudah sesuai
            if (splitTotal === cartTotalAmount && cartTotalAmount > 0) {
                splitLabel.classList.remove('text-red-500');
                splitLabel.classList.add('text-[#059669]'); // Warna hijau
            } else {
                splitLabel.classList.remove('text-[#059669]');
                splitLabel.classList.add('text-red-500');
            }
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const totalEl = document.getElementById('cart-total');
            const badge = document.getElementById('cart-badge');
            
            container.innerHTML = '';
            let total = 0;
            let count = 0;

            if (cart.length === 0) {
                container.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
                badge.classList.add('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                badge.classList.remove('hidden');
                
                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    count += item.qty;

                    const cartItem = `
                        <div class="bg-white border-2 border-app-dark rounded-xl p-3 flex gap-3 neo-shadow-sm mb-3 relative">
                            <img src="${item.img}" class="w-16 h-16 object-cover border-2 border-app-dark rounded-lg">
                            <div class="flex-1 pr-6">
                                <h4 class="text-sm font-black text-app-dark leading-tight truncate" title="${item.name}">${item.name}</h4>
                                <p class="text-brand-500 font-bold text-xs mb-2">${formatRp(item.price)}</p>
                                
                                <!-- Edit Qty -->
                                <div class="flex items-center gap-3">
                                    <div class="flex items-center border-2 border-app-dark rounded-lg overflow-hidden">
                                        <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 bg-slate-100 font-black hover:bg-slate-200 transition-colors">-</button>
                                        <span class="w-8 h-7 flex items-center justify-center font-bold text-xs border-x-2 border-app-dark bg-white">${item.qty}</span>
                                        <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 bg-slate-100 font-black hover:bg-slate-200 transition-colors">+</button>
                                    </div>
                                </div>
                            </div>
                            <!-- Tombol Delete X Merah di Ujung Kanan Atas -->
                            <button onclick="removeItem(${item.id})" class="absolute top-3 right-3 text-red-500 hover:text-red-600 active:scale-90 transition-all text-xl leading-none" title="Hapus Item">
                                <i class="fa-regular fa-circle-xmark"></i>
                            </button>
                        </div>
                    `;
                    container.innerHTML += cartItem;
                });
            }

            totalEl.innerText = formatRp(total);
            badge.innerText = count;
            calculateSplitTotal(); // Update split info ketika cart berubah
        }

        // Tutup modal jika klik background gelap di luar box
        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if(e.target === this) closeDetailModal();
        });
        document.getElementById('filter-modal').addEventListener('click', function(e) {
            if(e.target === this) closeFilterModal();
        });

        // Inisialisasi awal
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
